name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build package
        run: npm run build

      - name: Test CLI execution
        run: |
          mkdir -p /tmp/test-stable-frontend
          cd /tmp/test-stable-frontend
          node $GITHUB_WORKSPACE/bin/index.js
          test -f AGENTS.md
          test -f CLAUDE.md
          test -f .agents/rules/01-architecture.md
